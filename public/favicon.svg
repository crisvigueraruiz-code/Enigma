<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Background Shield Circle -->
  <circle cx="50" cy="50" r="48" fill="#132216" stroke="#059669" stroke-width="3" />
  <!-- Ancient Oak / Pine Silhouette -->
  <polygon points="50,15 30,42 42,42 22,68 44,68 38,82 62,82 56,68 78,68 58,42 70,42" fill="url(#forestGrad)" />
  <!-- Golden Rune Core in the trunk -->
  <circle cx="50" cy="52" r="5" fill="url(#goldGrad)" />
  <circle cx="50" cy="52" r="9" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2,2" />
</svg>
